<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <!-- Local SEO Geo Tags -->

  <!-- DNS Prefetch & Preconnect for Core Web Vitals (TTFB Optimization) -->
  <link rel="preconnect" href="https://formsubmit.co" crossorigin />
  <link rel="dns-prefetch" href="https://formsubmit.co" />

  <!-- LCP Hardening: Preload critical Hero Image - MUST match the exact hashed filename after build -->
  <link rel="preload" as="image" href="/assets/webp/hero_foyer-Dmv-Yoj7.webp" type="image/webp" fetchpriority="high" />

  <!-- Open Graph / Social Media Meta Tags -->
  <meta property="og:title" content="Top Luxury Interior Designers in Pune | KS Design Studio" />
  <meta property="og:description" content="Crafting bespoke, A-grade home narratives across Pune's premium micro-markets. We turn architectural volumes into personal sanctuaries for the elite." />

  <meta property="og:url" content="https://ksdesignstudio.in" />
  <meta property="og:image" content="https://ksdesignstudio.in/assets/webp/hero_foyer-Dmv-Yoj7.webp" />

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#1A1A1A" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Cloudflare Turnstile - async defer so it never blocks render -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>

  <!-- PWA Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js');
      });
    }
  </script>

  <!-- Predictive ML Prefetching (viewport-based) -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const prefetched = new Set();
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const link = entry.target.href;
            if (link && link.startsWith(window.location.origin) && !prefetched.has(link)) {
              const tag = document.createElement('link');
              tag.rel = 'prefetch';
              tag.href = link;
              document.head.appendChild(tag);
              prefetched.add(link);
            }
          }
        });
      }, { rootMargin: '50px' });
      setTimeout(() => {
        document.querySelectorAll('a[href]').forEach(a => observer.observe(a));
      }, 3000);
    });
  </script>
</body>
</html>
