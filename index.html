  <!-- Predictive Viewport Prefetching (runs during idle time) -->
  <script>
    window.addEventListener("load", () => {
      const schedulePrefetch = window.requestIdleCallback || ((cb) => setTimeout(cb, 6000));
      schedulePrefetch(() => {
        const prefetched = new Set();
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              const link = entry.target.href;
              if (link && link.startsWith(window.location.origin) && !prefetched.has(link)) {
                const tag = document.createElement('link');
                tag.rel = 'prefetch';
                tag.href = link;
                document.head.appendChild(tag);
                prefetched.add(link);
              }
            }
          });
        }, { rootMargin: '50px' });
        document.querySelectorAll('a[href]').forEach(a => observer.observe(a));
      });
    });
  </script>
